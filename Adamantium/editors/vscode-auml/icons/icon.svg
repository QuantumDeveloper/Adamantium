<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- full-width element plate (background to everything) -->
  <rect x="10" y="10" width="236" height="236" rx="40" fill="#34465A" stroke="#5E7286" stroke-width="10"/>
  <!-- atomic number, beyond the periodic table -->
  <text x="34" y="80" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="600" fill="#9FB3C4">137</text>
  <!-- &lt;Au&gt; — symbol wrapped in markup brackets -->
  <text x="128" y="182" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="700" text-anchor="middle">
    <tspan fill="#2BB3C5">&lt;</tspan><tspan fill="#EAF0F5">Au</tspan><tspan fill="#2BB3C5">&gt;</tspan>
  </text>
</svg>
