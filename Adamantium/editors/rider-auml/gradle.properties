# --- Versions you may need to adjust to your setup ---

# IntelliJ IDEA Community version to build against. Pick a version <= your Rider's IntelliJ
# version (e.g. Rider 2025.2 -> use 2025.2 or lower). sinceBuild must match (252 -> "252").
platformVersion=2024.3
sinceBuild=243

# The LSP4IJ plugin version you have installed in Rider.
# Check: Rider -> Settings -> Plugins -> LSP4IJ -> version, then set it here.
lsp4ijPlugin=com.redhat.devtools.lsp4ij:0.14.0

# Configuration used to publish the bundled language server (Release for distribution).
serverConfiguration=Release

# --- Build settings ---
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
